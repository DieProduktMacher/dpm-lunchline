<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DPM Lunchline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---- DPM design tokens (aus dem DPM Design System: tokens/colors.css, web.css) ---- */
  :root {
    --dpm-black: #000000;
    --dpm-white: #ffffff;
    --dpm-grey-10: #E6E6E6;
    --dpm-grey-20: #CFCFCF;
    --dpm-grey-30: #B4B4B4;
    --dpm-cta: #5C69DF;           /* --colors--main-cta-d, echte Website-CTA-Farbe */
    --dpm-saffron: #F8C81D;
    --dpm-peach: #FFA591;
    --dpm-violet: #DFABFF;
    --dpm-periwinkle: #B6BDFD;
    --dpm-blue: #5AD3E4;
    --dpm-periwinkle-dark: #1A1157;
    --dpm-magenta: #E71D4D;
    --dpm-orange: #FF9737;
    --radius-card: 24px;
    --radius-pill: 100px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, -apple-system, sans-serif;
    background: var(--dpm-white);
    color: var(--dpm-black);
    letter-spacing: -0.01em;
  }
  header {
    background: var(--dpm-white);
    color: var(--dpm-black);
    padding: 28px 20px;
    border-bottom: 1px solid var(--dpm-grey-20);
  }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand svg.dpm-logo { height: 34px; width: auto; display: block; }
  .brand .divider {
    width: 1px;
    height: 24px;
    background: var(--dpm-grey-20);
  }
  .brand h1 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .today-pill {
    background: var(--dpm-black);
    color: var(--dpm-white);
    font-size: 0.8rem;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    white-space: nowrap;
  }
  .subline {
    max-width: 960px;
    margin: 8px auto 0;
    font-size: 0.9rem;
    color: #555;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    display: grid;
    gap: 18px;
  }
  .card {
    background: var(--dpm-white);
    border: 1px solid var(--dpm-grey-20);
    border-radius: var(--radius-card);
    padding: 22px 24px;
    position: relative;
    overflow: hidden;
  }
  .accent-tab {
    position: absolute;
    top: 0; left: 0;
    width: 6px;
    height: 100%;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
    padding-left: 10px;
  }
  .card-head h2 {
    margin: 0 0 4px;
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .card-head .sub {
    color: #555;
    font-size: 0.85rem;
  }
  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: var(--radius-pill);
    background: var(--dpm-black);
    color: var(--dpm-white);
    white-space: nowrap;
  }
  .badge.warn {
    background: var(--dpm-magenta);
  }
  ul.dishes {
    list-style: none;
    margin: 16px 0 4px;
    padding: 0 0 0 10px;
    display: grid;
    gap: 12px;
  }
  ul.dishes li {
    border-top: 1px solid var(--dpm-grey-10);
    padding-top: 12px;
  }
  ul.dishes li:first-child {
    border-top: none;
    padding-top: 0;
  }
  .dish-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    font-weight: 600;
    font-size: 0.98rem;
  }
  .dish-desc {
    color: #666;
    font-size: 0.85rem;
    margin-top: 3px;
    font-weight: 400;
  }
  .price {
    white-space: nowrap;
    font-weight: 700;
    background: var(--dpm-grey-10);
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    font-size: 0.85rem;
  }
  .empty-note {
    color: #666;
    font-size: 0.9rem;
    margin: 12px 0 0;
    padding-left: 10px;
  }
  details {
    margin-top: 14px;
    padding-left: 10px;
  }
  summary {
    cursor: pointer;
    color: var(--dpm-cta);
    font-size: 0.85rem;
    font-weight: 500;
  }
  .week-day-title {
    font-weight: 700;
    font-size: 0.78rem;
    margin: 14px 0 6px;
    color: #777;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  a.source-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 16px;
    margin-left: 10px;
    padding: 7px 16px;
    background: var(--dpm-cta);
    color: var(--dpm-white) !important;
    border-radius: var(--radius-pill);
    font-size: 0.78rem;
    font-weight: 600;
    text-decoration: none;
    transition: opacity .2s;
  }
  a.source-link:hover { opacity: 0.85; }
  footer {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 20px 40px;
    color: var(--dpm-grey-30);
    font-size: 0.78rem;
  }
</style>
</head>

;
const WEEKDAYS_DE = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
const ACCENTS = ["#F8C81D", "#FFA591", "#DFABFF", "#B6BDFD", "#5AD3E4"]; // Saffron, Peach, Violet, Periwinkle, Blue

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function renderDishList(dishes) {
  if (!dishes || dishes.length === 0) return "";
  return `<ul class="dishes">${dishes.map(d => `
    <li>
      <div class="dish-row">
        <span>${escapeHtml(d.dish)}</span>
        ${d.price ? `<span class="price">${escapeHtml(d.price)}</span>` : ""}
      </div>
      ${d.description ? `<div class="dish-desc">${escapeHtml(d.description)}</div>` : ""}
    </li>`).join("")}</ul>`;
}

function renderRestaurant(r, todayName, idx) {
  const todayDishes = r.days && r.days[todayName];
  const otherDays = Object.keys(r.days || {}).filter(d => d !== todayName);
  const accent = ACCENTS[idx % ACCENTS.length];

  let statusBadge = "";
  if (r.status !== "ok") {
    statusBadge = `<span class="badge warn">Fehler beim Abrufen</span>`;
  } else if (!todayDishes) {
    statusBadge = `<span class="badge warn">Heute nichts gefunden</span>`;
  } else {
    statusBadge = `<span class="badge">${escapeHtml(r.format === "pdf" ? "PDF" : "Website")}</span>`;
  }

  const body = todayDishes
    ? renderDishList(todayDishes)
    : `<p class="empty-note">${r.status === "ok"
        ? "Für heute liegt kein Eintrag vor (z. B. Ruhetag oder noch nicht aktualisiert)."
        : escapeHtml(r.error || "Konnte nicht geladen werden.")}</p>`;

  const weekDetails = otherDays.length ? `
    <details>
      <summary>Restliche Woche anzeigen</summary>
      ${otherDays.map(d => `
        <div class="week-day-title">${escapeHtml(d)}</div>
        ${renderDishList(r.days[d])}
      `).join("")}
    </details>` : "";

  return `
    <section class="card">
      <div class="accent-tab" style="background:${accent}"></div>
      <div class="card-head">
        <div>
          <h2>${escapeHtml(r.name)}</h2>
          <div class="sub">${escapeHtml(r.address)}${r.walk_minutes ? " · ca. " + r.walk_minutes + " Min. Fußweg" : ""}</div>
        </div>
        ${statusBadge}
      </div>
      ${body}
      ${weekDetails}
      <a class="source-link" href="${escapeHtml(r.source_url)}" target="_blank" rel="noopener">Quelle öffnen ↗</a>
    </section>`;
}

async function load() {
  const today = new Date();
  const todayName = WEEKDAYS_DE[today.getDay() === 0 ? 6 : today.getDay() - 1];
  document.getElementById("today-label").textContent =
    todayName + ", " + today.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });

  const cardsEl = document.getElementById("cards");
  const footerEl = document.getElementById("footer-note");

  try {
    const data = EMBEDDED_DATA;

    let prefix = "";
    if (["Samstag", "Sonntag"].includes(todayName)) {
      prefix = `<p class="empty-note">Heute ist ${todayName} – die meisten Mittagstische machen am Wochenende Pause. Hier trotzdem die Wochenkarten:</p>`;
    }
    cardsEl.innerHTML = prefix;

    (data.restaurants || []).forEach((r, i) => {
      cardsEl.insertAdjacentHTML("beforeend", renderRestaurant(r, todayName, i));
    });

    footerEl.textContent = "Zuletzt aktualisiert: " + (data.generated_at || "unbekannt") +
      (data.note ? " — " + data.note : "");
  } catch (e) {
    cardsEl.innerHTML = `<p class="empty-note">menus.json konnte nicht geladen werden (${escapeHtml(e.message)}). ` +
      `Läuft diese Seite über einen lokalen Server (z. B. "python3 -m http.server")?</p>`;
  }
}

load();
