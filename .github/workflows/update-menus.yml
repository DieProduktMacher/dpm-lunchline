name: Update Mittagsmenüs

on:
  schedule:
    # Alle 30 Min, werktags 08:00-11:00 UTC = 09:00-12:00 Europe/Berlin
    # (Winterzeit) bzw. 10:00-13:00 (Sommerzeit) - Cron läuft in UTC und
    # verschiebt sich daher je nach Jahreszeit um eine Stunde gegenüber der
    # lokalen Zeit. Augustiner lädt die Tageskarte nicht immer schon
    # morgens hoch, manchmal erst gegen Mittag - deshalb mehrere Läufe
    # über den Vormittag verteilt statt nur 1-2 feste Uhrzeiten. Der
    # Scraper erkennt eine noch nicht aktualisierte Karte selbst (status
    # "stale" statt falscher "ok"-Daten), jeder zusätzliche Lauf gibt ihr
    # aber eine reale Chance, rechtzeitig vor Ende des Tagesschmankerls
    # (11:30-15:00 Uhr) aktuell zu sein.
    - cron: "0,30 8-10 * * 1-5"
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}   # manuell über den "Run workflow"-Button auslösbar

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape aktuelle Mittagsmenüs
        run: python3 scraper.py

      - name: Commit & push, falls sich menus.json geändert hat
        run: |
          git config user.name "lunchline-bot"
          git config user.email "lunchline-bot@users.noreply.github.com"
          if git diff --quiet -- menus.json; then
            echo "Keine Änderungen an menus.json."
          else
            git add menus.json
            git commit -m "Mittagsmenüs aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          fi
