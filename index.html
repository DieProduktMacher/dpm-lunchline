<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DPM Lunchline</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script data-goatcounter="https://dpm-lunchline.goatcounter.com/count"
    async src="//gc.zgo.at/count.js"></script>
<style>
  /* ---- DPM design tokens (aus dem DPM Design System: tokens/colors.css, web.css) ---- */
  :root {
    --dpm-black: #000000;
    --dpm-white: #ffffff;
    --dpm-grey-10: #E6E6E6;
    --dpm-grey-20: #CFCFCF;
    --dpm-grey-30: #B4B4B4;
    --dpm-cta: #5C69DF;           /* --colors--main-cta-d, echte Website-CTA-Farbe */
    --dpm-saffron: #F8C81D;
    --dpm-peach: #FFA591;
    --dpm-violet: #DFABFF;
    --dpm-periwinkle: #B6BDFD;
    --dpm-blue: #5AD3E4;
    --dpm-periwinkle-dark: #1A1157;
    --dpm-magenta: #E71D4D;
    --dpm-orange: #FF9737;
    --radius-card: 24px;
    --radius-pill: 100px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, -apple-system, sans-serif;
    background: var(--dpm-white);
    color: var(--dpm-black);
    letter-spacing: -0.01em;
  }
  header {
    background: var(--dpm-white);
    color: var(--dpm-black);
    padding: 28px 20px;
    border-bottom: 1px solid var(--dpm-grey-20);
  }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand svg.dpm-logo { height: 34px; width: auto; display: block; }
  .brand .divider {
    width: 1px;
    height: 24px;
    background: var(--dpm-grey-20);
  }
  .brand h1 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .today-pill {
    background: var(--dpm-black);
    color: var(--dpm-white);
    font-size: 0.8rem;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    white-space: nowrap;
  }
  .subline {
    max-width: 960px;
    margin: 8px auto 0;
    font-size: 0.9rem;
    color: #555;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    display: grid;
    gap: 18px;
  }
  .section-title {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 12px 0 0;
    letter-spacing: -0.01em;
  }
  main > .section-title:first-child { margin-top: 0; }
  .section-subtitle {
    font-size: 0.85rem;
    color: #666;
    margin: -12px 0 4px;
  }
  .card {
    background: var(--dpm-white);
    border: 1px solid var(--dpm-grey-20);
    border-radius: var(--radius-card);
    padding: 22px 24px;
    position: relative;
    overflow: hidden;
  }
  .accent-tab {
    position: absolute;
    top: 0; left: 0;
    width: 6px;
    height: 100%;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
    padding-left: 10px;
  }
  .card-head h2 {
    margin: 0 0 4px;
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .card-head .sub {
    color: #555;
    font-size: 0.85rem;
  }
  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: var(--radius-pill);
    background: var(--dpm-black);
    color: var(--dpm-white);
    white-space: nowrap;
  }
  .badge.warn {
    background: var(--dpm-magenta);
  }
  .badge.muted {
    background: var(--dpm-grey-30);
    color: var(--dpm-black);
  }
  ul.dishes {
    list-style: none;
    margin: 16px 0 4px;
    padding: 0 0 0 10px;
    display: grid;
    gap: 12px;
  }
  ul.dishes li {
    border-top: 1px solid var(--dpm-grey-10);
    padding-top: 12px;
  }
  ul.dishes li:first-child {
    border-top: none;
    padding-top: 0;
  }
  .dish-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    font-weight: 600;
    font-size: 0.98rem;
  }
  .dish-desc {
    color: #666;
    font-size: 0.85rem;
    margin-top: 3px;
    font-weight: 400;
  }
  .price {
    white-space: nowrap;
    font-weight: 700;
    background: var(--dpm-grey-10);
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    font-size: 0.85rem;
  }
  .empty-note {
    color: #666;
    font-size: 0.9rem;
    margin: 12px 0 0;
    padding-left: 10px;
  }
  details {
    margin-top: 14px;
    padding-left: 10px;
  }
  summary {
    cursor: pointer;
    color: var(--dpm-cta);
    font-size: 0.85rem;
    font-weight: 500;
  }
  .week-day-title {
    font-weight: 700;
    font-size: 0.78rem;
    margin: 14px 0 6px;
    color: #777;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  a.source-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 16px;
    margin-left: 10px;
    padding: 7px 16px;
    background: var(--dpm-cta);
    color: var(--dpm-white) !important;
    border-radius: var(--radius-pill);
    font-size: 0.78rem;
    font-weight: 600;
    text-decoration: none;
    transition: opacity .2s;
  }
  a.source-link:hover { opacity: 0.85; }
  footer {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 20px 40px;
    color: var(--dpm-grey-30);
    font-size: 0.78rem;
  }
  .weekend-card {
    text-align: center;
    padding: 56px 28px;
  }
  .weekend-code {
    margin: 0;
    font-size: 4.2rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .weekend-title {
    margin: 10px 0 8px;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .weekend-text {
    max-width: 420px;
    margin: 0 auto;
    color: #555;
    font-size: 0.95rem;
  }
  .weekend-meta {
    margin-top: 24px;
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    color: var(--dpm-grey-30);
  }
  .weekend-toggle {
    margin-top: 26px;
  }
  .weekend-toggle summary {
    display: inline-block;
  }
  #weekend-cards {
    margin-top: 18px;
    text-align: left;
    display: grid;
    gap: 18px;
  }
</style>
</head>
